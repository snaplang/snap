[book]
authors = ["Snap Contributors"]
language = "en"
src = "src"
title = "Snap Programming Language"
description = "A programming language that compiles to Scratch (.sb3) projects"

[build]
build-dir = "book"

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/snaplang/snap"
edit-url-template = "https://github.com/snaplang/snap/edit/main/docs/{path}"
site-url = "/snap/"
no-section-label = false

[output.html.fold]
enable = true
level = 1

[output.html.playground]
editable = false
line-numbers = true

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-hierarchical-search = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3
